<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kgroup Parfumery — La senteur du luxe</title>
<meta name="description" content="Retrouvez Kgroup Parfumery sur Instagram, Facebook, TikTok et WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121110;
    --line: #37322a;
    --line-hover: #7f9a63;
    --sage: #8fac6f;
    --gold: #b08d57;
    --ink: #f3f1ea;
    --ink-muted: #b9b3a4;
  }

  *{ box-sizing: border-box; }

  body{
    margin: 0;
    min-height: 100svh;
    position: relative;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4rem 1.5rem 3rem;
    overflow-x: hidden;
  }

  /* ---- Fond photo, assombri pour garder le texte lisible ---- */
  body::before{
    content: "";
    position: fixed;
    inset: 0;
    background-image: url('background.jpg');
    background-size: cover;
    background-position: center 20%;
    filter: blur(2px) saturate(85%);
    transform: scale(1.05);
    z-index: -2;
  }
  body::after{
    content: "";
    position: fixed;
    inset: 0;
    background:
      linear-gradient(180deg, rgba(10,9,8,0.88) 0%, rgba(10,9,8,0.93) 45%, rgba(10,9,8,0.97) 100%);
    z-index: -1;
  }

  .wrap{
    width: 100%;
    max-width: 420px;
  }

  /* ---- Hero ---- */
  .hero{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: rise 0.9s ease-out 0.1s forwards;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .mark{
    width: 74px;
    height: 74px;
    border-radius: 50%;
    margin-bottom: 1.3rem;
    box-shadow: 0 0 0 1px rgba(143,172,111,0.35);
  }

  .brand{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 2.15rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin: 0;
  }

  .tagline{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1rem;
    color: var(--ink-muted);
    margin: 0.5rem 0 1.6rem;
    letter-spacing: 0.02em;
  }

  .rule{
    width: 46px;
    height: 1px;
    background: var(--gold);
    opacity: 0.75;
    margin-bottom: 2.4rem;
  }

  /* ---- Links ---- */
  .links{
    display: flex;
    flex-direction: column;
  }

  .link{
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 0.95rem 0.4rem;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.25s ease, padding-left 0.25s ease, color 0.25s ease;
  }

  .links a:last-child{
    border-bottom: 1px solid var(--line);
  }

  .link:hover, .link:focus-visible{
    border-color: var(--line-hover);
    padding-left: 0.7rem;
    color: var(--sage);
    outline: none;
  }

  .link:focus-visible{
    box-shadow: 0 0 0 2px rgba(143,172,111,0.35);
    border-radius: 2px;
  }

  .link svg{
    flex-shrink: 0;
    width: 19px;
    height: 19px;
    stroke: currentColor;
    opacity: 0.85;
  }

  .link-label{
    font-size: 0.96rem;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .link-sub{
    display: block;
    font-size: 0.74rem;
    color: var(--ink-muted);
    margin-top: 0.15rem;
    font-weight: 300;
  }

  /* ---- Section dividers ---- */
  .section-label{
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--ink-muted);
    opacity: 0.55;
    margin: 1.7rem 0 0.3rem 0.4rem;
  }

  /* ---- Footer ---- */
  footer{
    margin-top: 3rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .hero{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="hero">

      <h1 class="brand">Kgroup Parfumery</h1>

      <div class="rule"></div>

    <nav class="links">

    </nav>

    <footer>© 2026 Kgroup Parfumery</footer>

  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kgroup Parfumery — La senteur du luxe</title>
<meta name="description" content="Retrouvez Kgroup Parfumery sur Instagram et commandez directement via WhatsApp.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #121110;
    --bg-soft: #17140f;
    --line: #2c2820;
    --line-hover: #7f9a63;
    --sage: #8fac6f;
    --sage-soft: #6f8a54;
    --gold: #b08d57;
    --ink: #f3f1ea;
    --ink-muted: #a8a296;
  }

  *{ box-sizing: border-box; }

  html{ -webkit-text-size-adjust: 100%; }

  body{
    margin: 0;
    min-height: 100svh;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 700px 500px at 50% -10%, rgba(143,172,111,0.08), transparent 60%);
    color: var(--ink);
    font-family: 'Jost', system-ui, sans-serif;
    font-weight: 300;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 4.5rem 1.5rem 3rem;
  }

  .wrap{
    width: 100%;
    max-width: 420px;
  }

  /* ---- Hero ---- */
  .hero{
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    opacity: 0;
    animation: rise 0.9s ease-out 0.1s forwards;
  }

  @keyframes rise{
    from{ opacity: 0; transform: translateY(10px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .mark{
    width: 58px;
    height: 58px;
    margin-bottom: 1.4rem;
  }
  .mark circle, .mark path{
    stroke: var(--sage);
  }

  .brand{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 500;
    font-size: 2.15rem;
    letter-spacing: 0.04em;
    color: var(--ink);
    margin: 0;
  }

  .tagline{
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-weight: 400;
    font-size: 1rem;
    color: var(--ink-muted);
    margin: 0.5rem 0 1.6rem;
    letter-spacing: 0.02em;
  }

  .rule{
    width: 46px;
    height: 1px;
    background: var(--gold);
    opacity: 0.7;
    margin-bottom: 2.6rem;
  }

  /* ---- Links ---- */
  .links{
    display: flex;
    flex-direction: column;
  }

  .link{
    display: flex;
    align-items: center;
    gap: 0.9rem;
    padding: 1.05rem 0.4rem;
    border-top: 1px solid var(--line);
    text-decoration: none;
    color: var(--ink);
    transition: border-color 0.25s ease, padding-left 0.25s ease, color 0.25s ease;
  }

  .links a:last-child{
    border-bottom: 1px solid var(--line);
  }

  .link:hover, .link:focus-visible{
    border-color: var(--line-hover);
    padding-left: 0.7rem;
    color: var(--sage);
    outline: none;
  }

  .link:focus-visible{
    box-shadow: 0 0 0 2px rgba(143,172,111,0.35);
    border-radius: 2px;
  }

  .link svg{
    flex-shrink: 0;
    width: 19px;
    height: 19px;
    stroke: currentColor;
    opacity: 0.85;
  }

  .link-label{
    font-size: 0.98rem;
    font-weight: 400;
    letter-spacing: 0.01em;
  }

  .link-sub{
    display: block;
    font-size: 0.76rem;
    color: var(--ink-muted);
    margin-top: 0.15rem;
    font-weight: 300;
  }

  /* ---- Footer ---- */
  footer{
    margin-top: 3rem;
    text-align: center;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: var(--ink-muted);
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .hero{ animation: none; opacity: 1; }
  }
</style>
</head>
<body>

  <div class="wrap">

    <div class="hero">

        <circle cx="50" cy="58" r="34" stroke-width="2.2"/>
        <rect x="44" y="14" width="12" height="16" rx="2" stroke-width="2.2"/>
        <path d="M40 16 L32 10 M40 20 L30 18 M40 24 L32 26" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M36 66 C 42 50, 58 50, 64 66 C 58 58, 42 58, 36 66 Z" stroke-width="2"/>
      </svg>

      <h1 class="brand">Kgroup Parfumery</h1>
      <p class="tagline">La senteur du luxe</p>
      <div class="rule"></div>
    </div>

    <nav class="links">

      <a class="link" href="https://instagram.com/kgroupparfumery" target="_blank" rel="noopener">

        <span><span class="link-label">Nous suivre sur Instagram</span><span class="link-sub">@kgroupparfumery</span></span>
      </a>

        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M20 12a8 8 0 1 1-3.6-6.7"/><path d="M20 12l-4-1 1-4"/></svg>
        <span><span class="link-label">Commander — Maroc</span><span class="link-sub">+212 696 975 699</span></span>

           (catalogue PDF, site vitrine, ou dossier Drive de la collection) -->

        <svg viewBox="0 0 24 24" fill="none" stroke-width="1.6"><path d="M4 19V6a1 1 0 0 1 1-1h9l6 6v8a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1z"/><path d="M14 5v5h5"/></svg>
        <span><span class="link-label">Découvrir la collection</span></span>
      </a>

    </nav>

    <footer>© 2026 Kgroup Parfumery</footer>

  </div>

</body>
</html>
